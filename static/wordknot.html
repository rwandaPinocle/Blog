<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
:root {
  --bg: #f4efe6;
  --panel: #fffdf8;
  --ink: #1f2335;
  --muted: #6b6f80;
  --line: #ddd5c6;
  --accent: #e4572e;
  --accent-ink: #fff;
  --indigo: #2e3a87;
  --card-bg: #ffffff;
  --card-line: #c9c0ae;
  --zone: #e9e1d2;
  --zone-ink: #2e3a87;
  --ok: #2f8f4e;
  --bad: #c62f2f;
  --slot: #ebe4d7;
  --shadow: 0 2px 6px rgba(40, 30, 10, .12);
  /* one colour per big-cube face: Right, Left, Top, Bottom, Front, Back */
  --f0: #1f8fb5;
  --f1: #c48a00;
  --f2: #e4572e;
  --f3: #6c4fc4;
  --f4: #2f8f4e;
  --f5: #b03a78;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171f;
    --panel: #1e212c;
    --ink: #ecebe6;
    --muted: #9a9cab;
    --line: #333748;
    --accent: #f06b45;
    --indigo: #8f9cf5;
    --card-bg: #262a37;
    --card-line: #454a5e;
    --zone: #252938;
    --zone-ink: #aab4ff;
    --ok: #4cc276;
    --bad: #f06060;
    --slot: #1a1d27;
    --shadow: 0 2px 8px rgba(0, 0, 0, .4);
    --f0: #4bb8de;
    --f1: #e2b23a;
    --f2: #f07a55;
    --f3: #9d85ec;
    --f4: #4cc276;
    --f5: #e06aa8;
  }
}

:root[data-theme="dark"] {
  --bg: #15171f;
  --panel: #1e212c;
  --ink: #ecebe6;
  --muted: #9a9cab;
  --line: #333748;
  --accent: #f06b45;
  --indigo: #8f9cf5;
  --card-bg: #262a37;
  --card-line: #454a5e;
  --zone: #252938;
  --zone-ink: #aab4ff;
  --ok: #4cc276;
  --bad: #f06060;
  --slot: #1a1d27;
  --shadow: 0 2px 8px rgba(0, 0, 0, .4);
  --f0: #4bb8de;
  --f1: #e2b23a;
  --f2: #f07a55;
  --f3: #9d85ec;
  --f4: #4cc276;
  --f5: #e06aa8;
}

.d0 {
  --fc: var(--f0);
}

.d1 {
  --fc: var(--f1);
}

.d2 {
  --fc: var(--f2);
}

.d3 {
  --fc: var(--f3);
}

.d4 {
  --fc: var(--f4);
}

.d5 {
  --fc: var(--f5);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.brand {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  display: grid;
  grid-template-columns: 10px 10px;
  gap: 2px;
}

.logo i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--indigo);
}

.logo i:nth-child(1),
.logo i:nth-child(4) {
  background: var(--accent);
}

#topinfo {
  font-size: 14px;
  color: var(--muted);
  text-align: right;
}

#topinfo b {
  color: var(--ink);
}

main {
  max-width: 1260px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

.narrowmax {
  max-width: 980px;
  margin: 0 auto;
}

h1,
h2,
h3 {
  margin: 0 0 12px;
  line-height: 1.2;
}

h1 {
  font-size: 26px;
}

h2 {
  font-size: 20px;
}

h3 {
  font-size: 16px;
}

p {
  margin: 0 0 12px;
}

.muted {
  color: var(--muted);
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  min-width: 0;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.stack>*+* {
  margin-top: 10px;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 720px) {
  .grid2 {
    grid-template-columns: 1fr;
  }
}

input[type=text] {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  min-width: 0;
  width: 100%;
}

input[type=text]:focus {
  outline: 2px solid var(--indigo);
  outline-offset: 1px;
}

label {
  font-size: 14px;
  color: var(--muted);
  display: block;
  margin-bottom: 4px;
}

.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 600;
}

.btn:hover:not(:disabled) {
  border-color: var(--indigo);
}

.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

.btn.primary:hover:not(:disabled) {
  filter: brightness(1.06);
}

.btn.on {
  background: var(--ok);
  color: #fff;
  border-color: var(--ok);
}

.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.btn.small {
  padding: 6px 10px;
  font-size: 14px;
}

.players {
  list-style: none;
  padding: 0;
  margin: 0;
}

.players li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
}

.players li:last-child {
  border-bottom: 0;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--ok);
  flex: none;
}

.dot.off {
  background: var(--muted);
  opacity: .5;
}

.tag {
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--zone);
  color: var(--zone-ink);
  font-weight: 600;
}

.tag.ok {
  background: var(--ok);
  color: #fff;
}

.fdot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--fc);
  margin-right: 6px;
  vertical-align: 0;
}

.code {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: .18em;
  color: var(--accent);
}

table.records {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

table.records td,
table.records th {
  text-align: left;
  padding: 5px 6px;
  border-bottom: 1px solid var(--line);
}

table.records th {
  color: var(--muted);
  font-weight: 600;
}

table.records td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

table.records tr.me td {
  background: color-mix(in srgb, var(--accent) 15%, transparent);
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 18px;
  align-items: start;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }
}

.views {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  justify-content: center;
  align-items: center;
}

/* Selected piece controls, right under the 3D view */
.inspect {
  max-width: 560px;
  margin: 12px auto 0;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
}

.wordrow {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: 45px;
  margin: 0 0 12px;
}

.wordrow:not(.empty) {
  background: color-mix(in srgb, var(--pc) 24%, var(--card-bg));
  border-radius: 10px;
}

/* same colour as the selected piece */
.wordrow .w {
  position: relative;
  z-index: 1;
  min-width: 0;
  border: 0;
  background: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  padding: 0 4px 18px;
  line-height: 1.2;
}

.wordrow .w:hover:not(.hid) {
  color: var(--indigo);
  background: color-mix(in srgb, var(--indigo) 8%, transparent);
}

.wordrow .w.hid {
  cursor: default;
}

.wordrow .w:focus-visible {
  outline: 2px solid var(--indigo);
  outline-offset: -2px;
}

.wordrow .hl {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 25%;
  border-radius: 10px;
  background: color-mix(in srgb, var(--muted) 24%, transparent);
  transform: translateX(calc(var(--i) * 100%));
  transition: transform .35s cubic-bezier(.3, .7, .3, 1);
}

.wordrow .hl small {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 6px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
}

.wordrow.empty {
  grid-template-columns: 1fr;
  align-items: center;
}

.wordrow.empty .w,
.wordrow.empty .w:hover {
  color: var(--muted);
  background: none;
  cursor: default;
  font-weight: 600;
  padding: 0;
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .wordrow .hl {
    transition: none;
  }
}

/* ---------- 3D tetrahedron ---------- */
.scene {
  position: relative;
  width: 100%;
  max-width: 560px;
  flex: 1 1 300px;
  touch-action: none;
  cursor: grab;
  user-select: none;
  overflow: hidden;
  border-radius: 14px;
  background: radial-gradient(circle at 50% 48%, var(--zone) 0%, transparent 70%);
}

.scene:active {
  cursor: grabbing;
}

.shape3d {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
  z-index: 2;
}

.tpiece {
  position: absolute;
  left: 0;
  top: 0;
  transform-style: preserve-3d;
  transform-origin: 0 0 0;
}

.tface {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  backface-visibility: hidden;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.tface svg.tri {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.tface polygon {
  fill: var(--card-bg);
  stroke: var(--card-line);
  stroke-width: 1.5;
  stroke-linejoin: round;
}

/* Piece colours (one per piece, see pieceCls in app.js) */
.p0 {
  --pc: var(--f0);
}

.p1 {
  --pc: var(--f1);
}

.p2 {
  --pc: var(--f3);
}

.p3 {
  --pc: var(--f5);
}

.tface.out polygon {
  fill: color-mix(in srgb, var(--pc) 16%, var(--card-bg));
  stroke: var(--pc);
  stroke-width: 5;
}

.tface.ghostface polygon {
  fill: var(--card-bg);
  stroke: var(--card-line);
  stroke-width: 2.5;
  stroke-dasharray: 6 5;
}

.tface span {
  position: absolute;
  left: 50%;
  top: 68%;
  transform: translate(-50%, -50%);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
}

.tpiece.clickable .tface {
  cursor: pointer;
}

/* Pieces other than the one nearest the camera are faded by mixing their colours toward the background.
   They stay opaque: nothing in the 3D shape is see-through. */
.tpiece.faded .tface polygon {
  fill: color-mix(in srgb, var(--card-bg) 45%, var(--bg));
}

.tpiece.faded .tface.out polygon {
  fill: color-mix(in srgb, var(--pc) 10%, color-mix(in srgb, var(--card-bg) 45%, var(--bg)));
  stroke: color-mix(in srgb, var(--pc) 45%, var(--bg));
}

.tpiece.faded .tface.ghostface polygon {
  stroke: color-mix(in srgb, var(--card-line) 60%, var(--bg));
}

.tpiece.faded .tface span {
  color: color-mix(in srgb, var(--ink) 50%, var(--bg));
}

.tpiece.sel .tface.out polygon {
  stroke: var(--pc);
  stroke-width: 7;
  fill: color-mix(in srgb, var(--pc) 24%, var(--card-bg));
}

.tpiece.locked .tface.out polygon {
  stroke: var(--ok);
}

.tpiece.hover .tface polygon {
  filter: brightness(.93);
}

.tpiece.ghost.sel .tface polygon {
  stroke: var(--accent);
  stroke-width: 3.5;
  fill: color-mix(in srgb, var(--accent) 18%, var(--card-bg));
}

.tpiece.ghost.hover .tface polygon,
.tpiece.ghost.dragover .tface polygon {
  fill: color-mix(in srgb, var(--accent) 25%, var(--card-bg));
}

.tface.hintface span {
  top: 66%;
  padding: .35em .55em;
  border-radius: 4px;
  background: color-mix(in srgb, var(--zone) 88%, #000);
  color: var(--ink);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.scene .hint {
  position: absolute;
  top: 8px;
  left: 10px;
  font-size: 15px;
  color: var(--muted);
  pointer-events: none;
}

.fdot.hidden {
  background: var(--muted);
}

/* ---------- pile chips ---------- */
/* The pile (and its heading) is as wide as the 3D view below it. */
.pool, .pilehead {
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
}

/* The pile keeps the height it has with every piece in it, so the page below never moves: an invisible copy
   of the full pile (.poolsizer) sets the height, and the pieces still in the pile (.poolitems) sit on top of it. */
.pool {
  box-sizing: border-box;
  display: grid;
  min-height: 90px;
  padding: 12px;
  border-radius: 14px;
  border: 2px dashed var(--line);
}

.poolsizer, .poolitems {
  grid-area: 1 / 1;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 0;
  justify-content: center;
  align-content: center;
}

.poolsizer {
  visibility: hidden;
}

.pool.target {
  border-color: var(--accent);
  cursor: pointer;
}

.pool.dragover {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}

.pool .empty-note {
  align-self: center;
  color: var(--muted);
  font-size: 14px;
}

/* Pile pieces overlap their neighbours' bounding boxes, so only the triangle itself takes the pointer. */
.chip {
  display: inline-flex;
  user-select: none;
  pointer-events: none;
  filter: drop-shadow(0 2px 3px rgba(40, 30, 10, .18));
}

.chip svg {
  display: block;
  overflow: visible;
}

.chip polygon {
  fill: var(--card-bg);
  stroke: var(--card-line);
  stroke-width: 1.5;
  stroke-linejoin: round;
}

.chip polygon {
  fill: color-mix(in srgb, var(--pc) 16%, var(--card-bg));
  stroke: color-mix(in srgb, var(--pc) 45%, var(--card-bg));
}

.chip polygon.outline {
  pointer-events: fill;
  fill: none;
  stroke: var(--pc);
  stroke-width: 3;
}

.chip text {
  fill: var(--ink);
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  font-family: inherit;
}

.chip.grab {
  cursor: grab;
}

.chip.selected polygon {
  fill: color-mix(in srgb, var(--accent) 14%, var(--card-bg));
}

.chip.selected polygon.outline {
  fill: none;
  stroke: var(--accent);
  stroke-width: 4;
}

.chip.big {
  margin: 4px auto;
  display: flex;
  justify-content: center;
}

/* ---------- check marks ---------- */
.tpiece.ok .tface.out polygon {
  stroke: var(--ok);
  fill: color-mix(in srgb, var(--ok) 14%, var(--card-bg));
}

.tpiece.bad .tface.out polygon {
  stroke: var(--bad);
  fill: color-mix(in srgb, var(--bad) 14%, var(--card-bg));
}

/* ---------- puzzle list ---------- */
.psection {
  font-size: 18px;
  margin: 18px 0 10px;
}

.psection .muted {
  font-size: 14px;
  font-weight: 400;
}

.plist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}

.pcard {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: "num title" "num meta" "num best";
  column-gap: 12px;
  row-gap: 2px;
  align-items: center;
  text-align: left;
  cursor: pointer;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
}

.pcard:hover {
  border-color: var(--indigo);
}

.pcard .pnum {
  grid-area: num;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--zone);
  color: var(--zone-ink);
  font-weight: 800;
}

.pcard.done .pnum {
  background: var(--ok);
  color: #fff;
}

.pcard .ptitle {
  grid-area: title;
  font-weight: 700;
}

.pcard .phints {
  grid-area: meta;
  font-size: 13px;
  color: var(--muted);
}

.pcard .pbest {
  grid-area: best;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.pcard.done .pbest {
  color: var(--ok);
}

/* ---------- language picker ---------- */
.langs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 8px;
}

.lang {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 8px 6px 6px;
  background: var(--panel);
}

.lang.on {
  border-color: var(--indigo);
}

.langbtn {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 0;
  background: none;
  cursor: pointer;
  font-weight: 700;
  padding: 4px 6px;
  border-radius: 8px;
  color: var(--muted);
}

.lang.on .langbtn {
  color: var(--ink);
}

.langbtn .box {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 2px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
}

.lang.on .langbtn .box {
  background: var(--indigo);
  border-color: var(--indigo);
  color: var(--panel);
}

.langbtn:focus-visible,
.segbtn:focus-visible {
  outline: 2px solid var(--indigo);
  outline-offset: 1px;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.segbtn {
  border: 0;
  background: none;
  padding: 3px 10px;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
}

.segbtn+.segbtn {
  border-left: 1px solid var(--line);
}

.segbtn.on {
  background: var(--zone);
  color: var(--zone-ink);
  font-weight: 700;
}

.lang:not(.on) .seg {
  opacity: .6;
}

@media (max-width: 520px) {
  .tlangs {
    display: none;
  }
}

.muted-ok {
  font-weight: 500;
  font-size: 14px;
  opacity: .85;
}

/* ---------- buttons on the 3D view ---------- */
.inspect .wordrow { margin: 0; }
#scenectl {
  position: absolute; z-index: 5; bottom: 10px; left: 12.5%; width: 75%;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px;
}
#scenectl:empty { display: none; }
.scenebtn { cursor: pointer; font-size: 13px; min-height: 36px; white-space: nowrap; padding-left: 6px; padding-right: 6px; }
.scenebtn.turnl, .scenebtn.turnr { display: grid; place-items: center; padding-top: 0; padding-bottom: 0; }
.scenebtn.trash { display: grid; place-items: center; width: 48px; padding: 0; color: var(--bad); }
.scenebtn.trash:hover:not(:disabled) { background: color-mix(in srgb, var(--bad) 12%, var(--card-bg)); }

@media (max-width: 520px) {
  .wordrow .w {
    font-size: 13px;
    padding-left: 2px;
    padding-right: 2px;
  }
}

.facing {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
  font-size: 14px;
}

.facing li {
  padding: 3px 0;
}

.banner {
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-weight: 600;
  background: var(--zone);
  color: var(--zone-ink);
  text-align: center;
}

.banner.bad {
  background: color-mix(in srgb, var(--bad) 18%, var(--panel));
  color: var(--bad);
}

.banner.ok {
  background: color-mix(in srgb, var(--ok) 18%, var(--panel));
  color: var(--ok);
}

.banner.spec {
  background: color-mix(in srgb, var(--accent) 16%, var(--panel));
  color: var(--accent);
}

.cluefields {
  display: grid;
  gap: 10px;
}

.cluefield .pair {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}

.cluefield .pair b {
  color: var(--ink);
}

.bigscore {
  font-size: 56px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}

.rules {
  font-size: 14px;
  color: var(--muted);
}

.rules ul {
  margin: 6px 0 0;
  padding-left: 18px;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%) translateY(120px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  transition: transform .25s ease, visibility .25s;
  max-width: calc(100vw - 32px);
  z-index: 10;
  font-size: 15px;
  visibility: hidden;
}

#toast.show {
  transform: translateX(-50%) translateY(0);
  visibility: visible;
}

@media (max-width: 520px) {
  main {
    padding: 14px 12px 40px;
  }

  .panel {
    padding: 12px;
  }

  .topbar {
    padding: 8px 12px;
  }

  .pool {
    gap: 8px;
    padding: 8px;
  }
}

/* ================= Puzzle page, from the Figma design ("Wordknot", Puzzle Page) =================
   One centred 600px column: the pile, the 3D view (600 x 520) with its buttons, the word row and Check Solution. */
:root {
  --page: #fffffa;
  --frame: #353531;
  --rule: #000;
  --view-bg: rgba(217, 217, 217, .17);
  --check-line: #7d7d7d;
  --hl: #d9d9d9;
  --word-ink: #000;
  /* piece colours */
  --pc-yellow: #ffb400;
  --pc-orange: #fe8c00;
  --pc-green: #00aa77;
  --pc-blue: #0073a4;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15171f;
    --frame: #c9c7bd;
    --rule: #ecebe6;
    --view-bg: rgba(217, 217, 217, .06);
    --check-line: #8a8a8a;
    --hl: #4a4d58;
    --word-ink: #ecebe6;
  }
}

:root[data-theme="dark"] {
  --page: #15171f;
  --frame: #c9c7bd;
  --rule: #ecebe6;
  --view-bg: rgba(217, 217, 217, .06);
  --check-line: #8a8a8a;
  --hl: #4a4d58;
  --word-ink: #ecebe6;
}

body {
  background: var(--page);
  font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.topbar {
  height: 50px;
  padding: 0 16px;
  background: var(--page);
  border-bottom: 4px solid var(--rule);
}

.p0 { --pc: var(--pc-yellow); }
.p1 { --pc: var(--pc-orange); }
.p2 { --pc: var(--pc-green); }
.p3 { --pc: var(--pc-blue); }

main:has(.play) {
  padding-top: 36px;
}

.play {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* Pile: a dashed box with the loose pieces in one row */
.play .pool {
  max-width: none;
  margin: 0 0 12px;
  padding-top: 18px;
  padding-bottom: 18px;
  padding-right: 12px;
  border: 1px dashed var(--frame);
  border-radius: 10px;
  background: var(--page);
  min-height: 0;
}

.play .poolsizer,
.play .poolitems {
  flex-wrap: nowrap;
  gap: 0;
}

.play .chip {
  filter: none;
}

.play .chip polygon {
  fill: color-mix(in srgb, var(--pc) 50%, var(--page));
  stroke: color-mix(in srgb, var(--pc) 35%, var(--page));
  stroke-width: 1;
}

.play .chip polygon.outline {
  fill: none;
  stroke: var(--pc);
  stroke-width: 2;
}

.play .chip text {
  fill: var(--word-ink);
  font-weight: 500;
}

.play .pool .empty-note {
  color: var(--muted);
  font-size: 18px;
}

/* 3D view: a light grey 600 x 520 panel */
.play .scene {
  max-width: none;
  flex: none;
  aspect-ratio: 600 / 520;
  border-radius: 0;
  background: var(--view-bg);
}

.play .tface.out polygon {
  fill: color-mix(in srgb, var(--pc) 50%, var(--page));
  stroke: var(--pc);
  stroke-width: 9;
}

.play .tpiece.sel .tface.out polygon {
  fill: color-mix(in srgb, var(--pc) 50%, var(--page));
  stroke: var(--pc);
  stroke-width: 9;
}

.play .tpiece.faded .tface.out polygon {
  fill: color-mix(in srgb, var(--pc) 22%, var(--page));
  stroke: color-mix(in srgb, var(--pc) 50%, var(--page));
}

.play .tface span {
  font-weight: 400;
  color: var(--word-ink);
}

.play .tpiece.faded .tface span {
  color: color-mix(in srgb, var(--word-ink) 55%, var(--page));
}

.play .tpiece.ok .tface.out polygon {
  stroke: var(--ok);
}

.play .tpiece.bad .tface.out polygon {
  stroke: var(--bad);
}

/* Buttons on the view: two white squares (turn left / right) with the red trash can between them */
.play #scenectl {
  left: 50%;
  width: auto;
  bottom: 5%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 24px;
}

.play .scenebtn {
  display: grid;
  place-items: center;
  width: 53px;
  height: 52px;
  min-height: 0;
  padding: 0;
  border: 1px solid var(--frame);
  border-radius: 0;
  background: #fff;
  color: #000;
}

.play .scenebtn.trash {
  width: 46px;
  height: 46px;
  border: 0;
  background: none;
}

.play .scenebtn.trash img {
  display: block;
  width: 46px;
  height: 46px;
}

.play .scenebtn.trash:hover:not(:disabled) {
  background: none;
  transform: scale(1.06);
}

.play .scenebtn:not(.trash):hover:not(:disabled) {
  background: #f1f1ec;
}

.play .scenebtn:disabled {
  opacity: .35;
  cursor: default;
}

/* Word row: a pill in the selected piece's colour, with a grey pill behind the hidden word */
.play .inspect {
  max-width: none;
  margin: 29px 0 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
}

.play .wordrow {
  height: 59px;
  border-radius: 59px;
  overflow: hidden;
}

.play .wordrow:not(.empty) {
  background: color-mix(in srgb, var(--pc) 75%, transparent);
  border-radius: 59px;
}

.play .wordrow .w {
  padding: 0 8px;
  font-size: 32px;
  font-weight: 400;
  color: var(--word-ink);
  border-radius: 59px;
}

.play .wordrow .w:hover:not(.hid) {
  color: var(--word-ink);
  background: rgba(255, 255, 255, .22);
}

.play .wordrow .hl {
  border-radius: 59px;
  background: var(--hl);
}

.play .wordrow.empty {
  background: var(--view-bg);
  border: 1px dashed var(--check-line);
}

.play .wordrow.empty .w {
  font-size: 20px;
}

/* Check Solution (Next Puzzle once solved) */
.checkbtn {
  align-self: center;
  width: 250px;
  height: 45px;
  margin-top: 29px;
  padding: 0;
  border: 1px solid var(--check-line);
  border-radius: 0;
  background: var(--page);
  color: var(--word-ink);
  font-size: 24px;
  cursor: pointer;
}

.checkbtn:hover:not(:disabled) {
  background: color-mix(in srgb, var(--check-line) 12%, var(--page));
}

.checkbtn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

@media (max-width: 520px) {
  main:has(.play) {
    padding-top: 20px;
  }

  .play .wordrow {
    height: 48px;
  }

  .play .wordrow .w {
    font-size: 20px;
  }

  .play .scenebtn {
    width: 46px;
    height: 45px;
  }

  .checkbtn {
    font-size: 20px;
  }
}

// Shared tetrahedron geometry (used by both the server and the browser).
//
// The big shape is a regular tetrahedron made of 4 half-size "pieces", one at each corner,
// with an empty octahedral space in the middle (a level-1 Sierpinski tetrahedron).
//
// World axes: x = right, y = up, z = toward the viewer. VERTS are the big tetrahedron's corners
// (circumradius 1, centred on the origin). Vertex v, the piece at corner v (slot v), and the face
// opposite vertex v (face v) all share the index v:
//   vertex/slot: 0 = top, 1 = back, 2 = front-right, 3 = front-left
//   face:        0 = Base, 1 = Front, 2 = Left, 3 = Right
// A piece has 4 words; words[k] sits on its local face k (opposite its local vertex k).
// An orientation is an even permutation P of the 4 vertices (the 12 rotations of a tetrahedron):
// local vertex k goes to world vertex P[k], so local face k faces world direction P[k].
// The piece in slot s shows 3 words outward (directions != s) and hides one facing the centre.

  const r = Math.sqrt(8) / 3;
  const rad = (d) => (d * Math.PI) / 180;

    [0, 1, 0],
    [0, -1 / 3, -r],
    [r * Math.sin(rad(120)), -1 / 3, -r * Math.cos(rad(120))],
    [r * Math.sin(rad(240)), -1 / 3, -r * Math.cos(rad(240))],
  ];
  const NORMALS = VERTS.map((v) => v.map((x) => -x)); // outward normal of face f
  const FACE_NAMES = ['Base', 'Front', 'Left', 'Right'];
  const FACE_ORDER = [1, 2, 3, 0];
  const SLOT_NAMES = ['Top corner', 'Back corner', 'Front-right corner', 'Front-left corner'];

  const sub = (a, b) => a.map((x, i) => x - b[i]);
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

  // The 12 rotations = even permutations of the vertices (identity first).
  const PERM = [];
  (function gen(prefix, rest) {
    if (!rest.length) {
      let inv = 0;
      for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) if (prefix[i] > prefix[j]) inv++;
      if (inv % 2 === 0) PERM.push(prefix);
      return;
    }
    rest.forEach((x, i) => gen([...prefix, x], [...rest.slice(0, i), ...rest.slice(i + 1)]));

  const ORIENTS = PERM.length; // 12

  const OUTWARD = [0, 1, 2, 3].map((s) => [0, 1, 2, 3].filter((f) => f !== s));

  // Each face as [top, bottom-left, bottom-right] vertex (= slot) indices, as seen from outside.
  // Side faces read with the apex at the top; the base reads with the back corner at the top.
  const TOP = [1, 0, 0, 0];
  const FACE_TRI = [0, 1, 2, 3].map((f) => {
    const T = TOP[f];
    let [a, b] = [0, 1, 2, 3].filter((v) => v !== f && v !== T);
    // T -> BL -> BR must run counter-clockwise when viewed from outside.
    if (dot(cross(sub(VERTS[a], VERTS[T]), sub(VERTS[b], VERTS[T])), NORMALS[f]) < 0) [a, b] = [b, a];

  function wordOn(words, o, dir) {
    return words[INV[o][dir]];
  }

  const permIndex = (p) => PERM.findIndex((q) => q.every((x, i) => x === p[i]));

  // Twist the piece in `slot` a third of a turn about its corner's axis (keeps the hidden word,
  // cycles the 3 outward ones). dir = 1: counter-clockwise as seen from outside that corner.
  function twist(o, slot, dir) {
    let [a, b, c] = OUTWARD[slot];
    if (dot(cross(sub(VERTS[b], VERTS[a]), sub(VERTS[c], VERTS[a])), VERTS[slot]) < 0) [b, c] = [c, b];

  // piece's corners through the centre of the opposite face.
  // Bottom pieces (slots 1-3) use the vertical axis (top corner -> base face), counter-clockwise seen from

  // For the top piece that axis runs through its own corner (that's just Twist left), so it uses the axis

});

  const f = [1, -1, 1];
  const A = M.map((row, i) => row.map((v, j) => v * f[i] * f[j]));
  return `matrix3d(${A[0][0]},${A[1][0]},${A[2][0]},0,${A[0][1]},${A[1][1]},${A[2][1]},0,${A[0][2]},${A[1][2]},${A[2][2]},0,0,0,0,1)`;
}

const apply = (M, v) => M.map((r) => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
const toCss = (p) => [p[0], -p[1], p[2]];
const scale = (v, k) => v.map((x) => x * k);
const add = (a, b) => a.map((x, i) => x + b[i]);
const len = (v) => Math.hypot(v[0], v[1], v[2]);

// Map a W x H triangle element (apex top-centre, base along the bottom) onto 3D points T, BL, BR (world px).
// The element's front faces `normal`; T/BL/BR are swapped if needed so it never shows mirrored.
function triTransform(T, BL, BR, normal) {
  let [t, bl, br] = [T, BL, BR].map(toCss);
  const n = toCss(normal);
  const frame = () => {
    const W = len(sub(br, bl));
    const mid = scale(add(bl, br), 0.5);
    const H = len(sub(mid, t));
    const ex = scale(sub(br, bl), 1 / W);
    const ey = scale(sub(mid, t), 1 / H);
    return { W, H, ex, ey, ez: cross(ex, ey) };
  };
  let fr = frame();
  if (dot(fr.ez, n) < 0) { [bl, br] = [br, bl]; fr = frame(); }
  const { W, H, ex, ey, ez } = fr;
  const O = sub(bl, scale(ey, H));
  const m = [...ex, 0, ...ey, 0, ...ez, 0, ...O, 1].map((x) => +x.toFixed(4));
  return { W, H, css: `matrix3d(${m.join(',')})` };
}

function applyCamera() {
  const M = camMatrix();
  const css = cssMatrix(M);
  document.querySelectorAll('.scene .shape3d').forEach((el) => { el.style.transform = css; });
  updateFocus();
}

// ---------------- rendering helpers ----------------

function triSvg(W, H) {
  return `<svg class="tri" viewBox="0 0 ${f1(W)} ${f1(H)}" preserveAspectRatio="none"><polygon points="${f1(W / 2)},2 ${f1(W - 1.5)},${f1(H - 1)} 1.5,${f1(H - 1)}"/></svg>`;
}

// The base's triangle has its corner at the back, so its words are turned 180° to read upright
// when you tilt the shape to look up at it from the front (front edge at the top).
const BASE = 0;

const markCls = (marks, s) => (marks && marks[s] === true ? 'ok' : marks && marks[s] === false ? 'bad' : '');

// The corner nearest the camera plane (largest depth toward the viewer), filled or empty.
function focusSlot() {
  if (!game || game.solved) return -1;
  const M = camMatrix();
  let best = -1;
  let bestZ = -Infinity;
  game.placement.forEach((x, s) => {
    const z = apply(M, VERTS[s])[2];
    if (z > bestZ + 1e-9) { bestZ = z; best = s; }
  });
  return best;
}

// After the camera moves: if a different piece is now nearest, update highlights and the panel in place
// (no full re-render, so dragging the view stays smooth).
function updateFocus() {
  if (!game || game.solved) return;
  const f = focusSlot();
  if (f === game.focus) return;
  game.focus = f;
  app.querySelectorAll('.scene .tpiece').forEach((el) => {
    const s = Number(el.dataset.hover);
    el.classList.toggle('sel', s === f);
    el.classList.toggle('faded', s !== f && f >= 0);
  });
  const panel = document.getElementById('inspector');
  if (panel) { panel.innerHTML = inspectorHTML(f); slideHidden(); }
  const ctl = document.getElementById('scenectl');
  if (ctl) ctl.innerHTML = sceneControlsHTML(f);
}

// slots: array of 4 ({card, orient} | null)
function tetraHTML({ slots, hints, interactive = false, marks = null, focus = -1, controls = '' }) {
  const { R } = sizes();
  const layer = () => {
    const pieces = [0, 1, 2, 3].map((s) => {
      const item = slots[s];
      const centre = scale(VERTS[s], R / 2);
      // Corners of the piece at slot s, shrunk slightly toward its centre to leave a visible seam.
      const pv = VERTS.map((v) => {
        const q = scale(add(VERTS[s], v), R / 2);
        return add(centre, scale(sub(q, centre), 0.955));
      });
      const faces = [0, 1, 2, 3].map((d) => {
        if (d === s) {
          // Inner side, facing the hollow centre, with the hidden word. Normally out of sight, but drawn like
          // the other sides so nothing is blank when a piece turns (e.g. the spin on a correct answer).
          if (!item) return '';
          const [a, b, c] = OUTWARD[s];
          const t = triTransform(pv[a], pv[b], pv[c], NORMALS[s]);
          const w = wordOn(item.card.words, item.orient, s);
          return `<div class="tface out inner" style="width:${f1(t.W)}px;height:${f1(t.H)}px;transform:${t.css}">${triSvg(t.W, t.H)}<span style="font-size:${fitFont(w, t.W * 0.56, t.W * 0.14)}px">${esc(w)}</span></div>`;
        }
        const [T, BL, BR] = FACE_TRI[d];
        const t = triTransform(pv[T], pv[BL], pv[BR], NORMALS[d]);
        if (!item) return `<div class="tface ghostface" style="width:${f1(t.W)}px;height:${f1(t.H)}px;transform:${t.css}">${triSvg(t.W, t.H)}</div>`;
        const w = wordOn(item.card.words, item.orient, d);
        const spin = d === BASE ? ';transform:translate(-50%,-50%) rotate(180deg)' : '';
        return `<div class="tface out" style="width:${f1(t.W)}px;height:${f1(t.H)}px;transform:${t.css}">${triSvg(t.W, t.H)}<span style="font-size:${fitFont(w, t.W * 0.56, t.W * 0.14)}px${spin}">${esc(w)}</span></div>`;
      }).join('');
      const cls = ['tpiece', item ? pieceCls(item.card.id) : 'ghost', s === focus ? 'sel' : focus >= 0 ? 'faded' : '', markCls(marks, s), interactive ? 'clickable' : ''].join(' ');
      return `<div class="${cls}" ${interactive ? `data-slot="${s}"` : ''} data-hover="${s}">${faces}</div>`;
    }).join('');
    // Each big face's hint fills the middle triangle of that face (the gap between its 3 corner pieces).
    // That triangle points the other way, so the element is placed apex-first and its text turned 180°
    // (the base's words are already turned 180°, so its hint isn't).
    const hintFaces = FACE_ORDER.map((f) => {
      const [T, BL, BR] = FACE_TRI[f].map((v) => scale(VERTS[v], R));
      const mid = (p, q) => scale(add(p, q), 0.5);
      const t = triTransform(mid(BL, BR), mid(T, BR), mid(T, BL), NORMALS[f]);
      const spin = f === BASE ? '' : ';transform:translate(-50%,-50%) rotate(180deg)';
      // The gap is left open (the inner sides show through it); the hint sits on a small shaded rectangle
      // (the span's own background) at the centre of the gap.
      return `<div class="tface hintface" style="width:${f1(t.W)}px;height:${f1(t.H)}px;transform:${t.css}"><span style="font-size:${fitFont(hints[f], t.W * 0.56, t.W * 0.13)}px${spin}">${esc(hints[f])}</span></div>`;
    }).join('');
    return `<div class="shape3d">${pieces}${hintFaces}</div>`;
  };
  return `<div class="scene" data-r="${R}" style="perspective:${PERSPECTIVE}px;perspective-origin:50% 48%">
      ${layer()}
      ${controls}
    </div>`;
}

// A loose piece, drawn as its unfolded net: a triangle split into 4 smaller triangles, one word each
// (the centre one inverted). Folding the 3 corner triangles up would make the piece.
// flip draws it upside down (words still upright), so pile pieces can interlock like a strip of triangles.
// The pile is one row of 4 pieces. Where there's room (the design's 600px column) they stand side by side, 139px
// each; on narrow screens they shrink and interlock, each sliding half a triangle under its neighbour.
const PILE_W = 600;
const pileInner = () => Math.min(PILE_W, window.innerWidth - 32) - 26; // less the box's padding and border
const pileSpaced = () => (pileInner() - 3 * 4) / 4 >= 120;
const chipSize = (big = false) => (big ? 200 : pileSpaced() ? 139 : Math.floor((pileInner() - 27) / 2.5));
// How far each pile piece slides under its neighbour (negative: a gap between them).
const chipOverlap = () => (pileSpaced() ? -4 : chipSize() / 2 - 9);
// ghost: an invisible stand-in, laid out like a pile piece (used to keep the pile's height constant).
function chipHTML(card, { movable = false, big = false, flip = false, ghost = false } = {}) {
  const S = chipSize(big);
  const H = (S * Math.sqrt(3)) / 2;
  const pts = (...ps) => ps.map((p) => `${f1(p[0])},${f1(flip ? H - p[1] : p[1])}`).join(' ');
  const ty = (y) => (flip ? H - y : y);
  const T = [S / 2, 0], L = [0, H], R = [S, H], ml = [S / 4, H / 2], mr = [(3 * S) / 4, H / 2], mb = [S / 2, H];
  const cells = [
    { poly: pts(ml, mr, mb), c: [S / 2, (2 * H) / 3] }, // centre
    { poly: pts(T, mr, ml), c: [S / 2, H / 3 + 3] }, // top
    { poly: pts(ml, mb, L), c: [S / 4, (5 * H) / 6 + 2] }, // bottom-left
    { poly: pts(mr, R, mb), c: [(3 * S) / 4, (5 * H) / 6 + 2] }, // bottom-right
  ];
  // All triangles first, then all words on top, so no word is covered by a neighbouring triangle.
  const body = cells.map((c) => `<polygon points="${c.poly}"/>`).join('')
    + card.words.map((w, i) => `<text x="${f1(cells[i].c[0])}" y="${f1(ty(cells[i].c[1]))}" font-size="${fitFont(w, S * (i === 0 ? 0.27 : 0.3), S * 0.085)}">${esc(w)}</text>`).join('');
  const cls = ['chip', pieceCls(card.id), movable ? 'grab' : '', big ? 'big' : ''].join(' ');
  const style = movable || ghost ? ` style="margin-left:${-chipOverlap()}px"` : '';
  if (ghost) return `<div class="${cls}"${style}><svg width="${S}" height="${f1(H)}"></svg></div>`;
  return `<div class="${cls}"${style} ${movable ? `draggable="true" data-card="${card.id}"` : ''} title="${esc(card.words.join(' · '))}">
      <svg width="${S}" height="${f1(H)}" viewBox="-3 -3 ${S + 6} ${f1(H + 6)}"><polygon class="outline" points="${pts(T, R, L)}"/>${body}</svg>
    </div>`;
}

// ---------------- screens ----------------

function langPickerHTML() {
  const n = settings.langs.length;
  const items = LangBuilder.LANGS.map((l) => {
    const on = settings.langs.includes(l.code);
    const script = l.native
      ? `<span class="seg" role="group" aria-label="${esc(l.name)} script">
          <button class="segbtn${settings.native[l.code] ? '' : ' on'}" data-script="${l.code}" data-native="0" aria-pressed="${!settings.native[l.code]}">${esc(l.roman)}</button>
          <button class="segbtn${settings.native[l.code] ? ' on' : ''}" data-script="${l.code}" data-native="1" aria-pressed="${!!settings.native[l.code]}" lang="${l.code}">${esc(l.native)}</button>
        </span>`
      : '';
    return `<div class="lang${on ? ' on' : ''}">
        <button class="langbtn" data-lang="${l.code}" aria-pressed="${on}"><span class="box" aria-hidden="true">${on ? '✓' : ''}</span>${esc(l.name)}</button>${script}
      </div>`;
  }).join('');
  return `<div class="panel">
      <h2>Languages <span class="muted" style="font-size:14px;font-weight:400">· ${n} picked, at least ${LangBuilder.MIN_LANGS}</span></h2>
      <div class="langs">${items}</div>
      <p class="muted" style="font-size:14px;margin:12px 0 0">Each face shows its English hint in 3 of these languages. For Japanese, Chinese and Korean, choose the
        romanized spelling or the native script. Changing languages changes the words in every puzzle, so solved puzzles are kept separately for each choice.</p>
    </div>`;
}

function renderList() {
  topinfo.innerHTML = '';
  const solved = loadSolved();
  const solvedCount = PUZZLES.filter((p) => solved[solvedKey(p.id)]).length;
  app.innerHTML = `
    <div class="narrowmax">
      ${langPickerHTML()}
      <div class="panel">
        <h1>Puzzles</h1>
        <p class="muted">${solvedCount} of ${PUZZLES.length} solved with these languages.</p>
        <div class="plist">
          ${PUZZLES.map((p, i) => {
            const b = solved[solvedKey(p.id)];
            return `<button class="pcard${b ? ' done' : ''}" data-open="${p.id}">
                <span class="pnum">${i + 1}</span>
                <span class="ptitle">${esc(p.title)}</span>
                <span class="phints">${p.hints.map(esc).join(' · ')}</span>
                <span class="pbest">${b ? '✓ Solved' : 'Not solved yet'}</span>
              </button>`;
          }).join('')}
        </div>
      </div>
      <div class="panel rules">
        <h2 style="color:var(--ink)">How to play</h2>
        <ul>
          <li>The big tetrahedron is built from 4 small pieces, one at each corner, with a hollow centre. Each piece has 4 words, one per side.</li>
          <li>Each of the 4 big faces has a <b>hint</b>. When solved, the 3 words showing on that face all go with its hint.</li>
          <li>At a corner, 3 of a piece's words face out and 1 faces the hollow centre, where it's hidden. Hidden words don't match any hint.</li>
          <li>Put every piece at the right corner, turned the right way, then press <b>Check Solution</b>.
            A wrong check shows which pieces are wrong.</li>
        </ul>
      </div>
    </div>`;
}

// Where the "hidden" highlight was last drawn, so it can slide from there to the new word.
let hiddenMark = null; // { key: 'cardId@slot', idx }

// The selected corner's piece: its 4 words in a row (in the piece's own fixed order) with a grey highlight
// behind the one facing the hollow centre, and the turn buttons. Buttons that can't act are greyed out.
function inspectorHTML(focus) {
  const item = !game.solved && focus >= 0 ? game.placement[focus] : null;
  const card = item ? game.cards[item.cardId] : null;
  let row;
  if (card) {
    const idx = INV[item.orient][focus];
    const key = `${card.id}@${focus}`;
    const from = hiddenMark && hiddenMark.key === key ? hiddenMark.idx : idx;
    hiddenMark = { key, idx };
    row = `<div class="wordrow ${pieceCls(card.id)}"><span class="hl" style="--i:${from}" data-to="${idx}" aria-hidden="true"></span>
        ${card.words.map((w, i) => `<button class="w${i === idx ? ' hid' : ''}" data-hideword="${i}" ${i === idx ? 'aria-current="true" title="Hidden"' : `title="Turn the piece so this word is hidden"`}>${esc(w)}</button>`).join('')}</div>`;
  } else {
    hiddenMark = null;
    row = `<div class="wordrow empty"><span class="w">${game.solved ? 'Solved' : 'Choose words from the pile'}</span></div>`;
  }
  return `<div class="inspect">${row}</div>`;
}

function sceneControlsHTML(focus) {
  if (!game || game.solved) return '';
  const item = focus >= 0 ? game.placement[focus] : null;
  const off = item ? '' : 'disabled';
  return `<button class="scenebtn turnl" data-twist="1" data-slot-turn="${focus}" title="Turn Left" aria-label="Turn Left" ${off}>${turnIcon(false)}</button>
    <button class="scenebtn trash" data-topool="${item ? item.cardId : ''}" title="Back to the pile" aria-label="Back to the pile" ${off}>${TRASH_ICON}</button>
    <button class="scenebtn turnr" data-twist="-1" data-slot-turn="${focus}" title="Turn Right" aria-label="Turn Right" ${off}>${turnIcon(true)}</button>`;
}

// Shrink any word too wide for its column (the row has a fixed height, so words never wrap), then slide the
// hidden-word highlight from where it was drawn to its new word.
function slideHidden() {
  app.querySelectorAll('#inspector .wordrow .w').forEach((el) => {
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 9) { fs -= 1; el.style.fontSize = `${fs}px`; }
  });
  const hl = app.querySelector('#inspector .hl');
  if (!hl || hl.style.getPropertyValue('--i') === hl.dataset.to) return;
  hl.getBoundingClientRect(); // commit the start position
  hl.style.setProperty('--i', hl.dataset.to);
}

function renderPlay() {
  const g = game;
  const p = g.puzzle;
  const idx = PUZZLES.findIndex((d) => d.id === p.id);
  const focus = focusSlot();
  g.focus = focus;
  const interactive = !g.solved;
  const slots = g.placement.map((x) => (x ? { card: g.cards[x.cardId], orient: x.orient } : null));
  const placedIds = new Set(g.placement.filter(Boolean).map((x) => x.cardId));
  const pool = g.order.filter((id) => !placedIds.has(id)).map((id) => g.cards[id]);
  const full = g.placement.every(Boolean);
  const next = PUZZLES[idx + 1];

  topinfo.innerHTML = `Puzzle <b>${idx + 1}</b> · ${esc(p.title)}<span class="tlangs"> · ${settings.langs.map((c) => esc(langLabel(c))).join(', ')}</span>`;

  // Once solved, the button moves on to the next puzzle (or replays the last one).
  const action = g.solved
    ? `<button class="checkbtn" data-open="${(next || p).id}">${next ? 'Next Puzzle' : 'Play Again'}</button>`
    : `<button class="checkbtn" id="check" ${full ? '' : 'disabled title="Place all 4 pieces first"'}>Check Solution</button>`;

  app.innerHTML = `<div class="play">
      <div class="pool" data-pool="1" style="padding-left:${12 + chipOverlap()}px">
        <div class="poolsizer" aria-hidden="true">${g.order.map((id) => chipHTML(g.cards[id], { ghost: true })).join('')}</div>
        <div class="poolitems">${pool.length ? pool.map((c, i) => chipHTML(c, { movable: true, flip: i % 2 === 1 })).join('') : `<span class="empty-note">${g.solved ? 'Solved!' : 'All pieces are placed.'}</span>`}</div>
      </div>
      ${tetraHTML({ slots, hints: g.built.hints, interactive, marks: g.marks, focus, controls: `<div id="scenectl">${sceneControlsHTML(focus)}</div>` })}
      <div id="inspector">${inspectorHTML(focus)}</div>
      ${action}
    </div>`;
  const checkBtn = document.getElementById('check');
  if (checkBtn) checkBtn.onclick = check;
}

function render() {
  if (game) renderPlay();
  else renderList();
  applyCamera();
  runPieceAnimation();
  if (pendingCelebrate) { pendingCelebrate = false; celebrate(); }
  slideHidden();
}

// ---------------- piece rotation animation ----------------

const ROTATE_MS = 450;
let pendingAnim = null; // {slot, M}: world rotation the piece at `slot` just went through

// 3x3 inverse (adjugate / determinant).
function inv3(m) {
  const [[a, b, c], [d, e, f], [g, h, i]] = m;
  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [
    [A / det, -(b * i - c * h) / det, (b * f - c * e) / det],
    [B / det, (a * i - c * g) / det, -(a * f - c * d) / det],
    [C / det, -(a * h - b * g) / det, (a * e - b * d) / det],
  ];
}
const mul3 = (X, Y) => X.map((row) => [0, 1, 2].map((j) => row[0] * Y[0][j] + row[1] * Y[1][j] + row[2] * Y[2][j]));
const cols = (vs) => [0, 1, 2].map((r) => vs.map((v) => v[r])); // vectors as matrix columns

// The rotation that took a piece from orientation `from` to `to`: world vertex w moves to G[w].
function rotationBetween(from, to) {
  const G = [0, 1, 2, 3].map((w) => PERM[to][INV[from][w]]);
  const A = cols([1, 2, 3].map((w) => VERTS[w]));
  const B = cols([1, 2, 3].map((w) => VERTS[G[w]]));
  return mul3(B, inv3(A));
}

// The orientation that puts the piece's word i into the hidden centre at `slot` with the smallest turn from
// orientation o. Three orientations hide that word; the turn angle comes from the rotation's trace.
function hideWordOrient(o, slot, i) {
  let best = o;
  let bestAngle = Infinity;
  PERM.forEach((P, n) => {
    if (P[i] !== slot) return;
    const M = rotationBetween(o, n);
    const angle = Math.acos(clamp((M[0][0] + M[1][1] + M[2][2] - 1) / 2, -1, 1));
    if (angle < bestAngle - 1e-9) { bestAngle = angle; best = n; }
  });
  return best;
}

// Turn a placed piece to a new orientation, animating the 3D piece through the rotation.
function rotatePiece(slot, orient) {
  const cur = game.placement[slot];
  if (!cur || cur.orient === orient) return;
  pendingAnim = { slot, M: rotationBetween(cur.orient, orient) };
  setOrient(slot, orient);
}

// The new orientation is already drawn: start the piece rotated back to where it was, then let it turn
// (about its own centre) into place.
function runPieceAnimation() {
  const anim = pendingAnim;
  pendingAnim = null;
  if (!anim) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = app.querySelectorAll(`.scene .tpiece[data-hover="${anim.slot}"]`);
  if (!els.length) return;
  const R = Number(els[0].closest('.scene').dataset.r);
  const c = toCss(scale(VERTS[anim.slot], R / 2)).map(f1);
  const about = (M) => `translate3d(${c[0]}px,${c[1]}px,${c[2]}px) ${cssMatrix(M)} translate3d(${-c[0]}px,${-c[1]}px,${-c[2]}px)`;
  const back = anim.M.map((row, i) => row.map((_, j) => anim.M[j][i])); // inverse of a rotation = transpose
  els.forEach((el) => {
    el.style.transition = 'none';
    el.style.transform = about(back);
    el.getBoundingClientRect(); // commit the start pose before transitioning
    el.style.transition = `transform ${ROTATE_MS}ms cubic-bezier(.3,.7,.3,1)`;
    el.style.transform = about([[1, 0, 0], [0, 1, 0], [0, 0, 1]]);
  });
}

// ---------------- solved animation ----------------

let pendingCelebrate = false;
let celebrateFrame = 0;

// Rotation by `angle` (radians) about the unit vector `a` (Rodrigues' formula), world coordinates.
function axisRotation(a, angle) {
  const [x, y, z] = a;
  const c = Math.cos(angle), s = Math.sin(angle), k = 1 - c;
  return [
    [c + x * x * k, x * y * k - z * s, x * z * k + y * s],
    [y * x * k + z * s, c + y * y * k, y * z * k - x * s],
    [z * x * k - y * s, z * y * k + x * s, c + z * z * k],
  ];
}

// On a correct answer every piece spins in place about a vertical axis through its own centre, starting fast and
// slowing exponentially (angle left = A·e^(-t/τ)), so each stops exactly in its solved orientation.
const SPIN_TAU = 0.4 / 0.75; // seconds for the remaining spin to fall to 1/e (0.4s stretched: 25% slower)
const SPIN_STOP = 0.002; // radians: below this the piece is treated as stopped
function celebrate() {
  cancelAnimationFrame(celebrateFrame);
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = [...app.querySelectorAll('.scene .tpiece')];
  if (!els.length) return;
  const R = Number(els[0].closest('.scene').dataset.r);
  const spins = els.map((el) => {
    const s = Number(el.dataset.hover);
    const c = toCss(scale(VERTS[s], R / 2)).map(f1);
    // 3 to 4.5 turns, alternating direction, so neighbours don't spin in lockstep.
    const A = (s % 2 ? 1 : -1) * 2 * Math.PI * (3 + s * 0.5);
    return { el, axis: [0, 1, 0], A, c };
  });
  const start = performance.now();
  const frame = (now) => {
    const t = (now - start) / 1000;
    let running = false;
    for (const p of spins) {
      if (!p.el.isConnected) continue;
      const a = p.A * Math.exp(-t / SPIN_TAU);
      p.el.style.transition = 'none';
      if (Math.abs(a) < SPIN_STOP) { p.el.style.transform = ''; continue; }
      running = true;
      p.el.style.transform = `translate3d(${p.c[0]}px,${p.c[1]}px,${p.c[2]}px) ${cssMatrix(axisRotation(p.axis, a))} translate3d(${-p.c[0]}px,${-p.c[1]}px,${-p.c[2]}px)`;
    }
    if (running) celebrateFrame = requestAnimationFrame(frame);
  };
  celebrateFrame = requestAnimationFrame(frame);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

// ---------------- 3D orbit ----------------

let drag = null;
let suppressClick = false;
app.addEventListener('pointerdown', (e) => {
  const scene = e.target.closest('.scene');
  if (!scene || e.button > 0 || e.target.closest('button')) return;
  drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, moved: false, scene, id: e.pointerId };
});
window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  if (!drag.moved) {
    drag.moved = true;
    try { drag.scene.setPointerCapture(e.pointerId); } catch {}
  }
  cam.yaw = drag.yaw + dx * 0.5;
  cam.pitch = clamp(drag.pitch + dy * 0.5, -85, 85);
  applyCamera();
});
window.addEventListener('pointerup', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.moved) {
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
  }
  drag = null;
});
window.addEventListener('pointercancel', () => { drag = null; });

// Hovering a piece highlights it.
app.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-hover]');
  const s = t ? t.dataset.hover : null;
  app.querySelectorAll('.hover').forEach((el) => el.classList.remove('hover'));
  if (s === null) return;
  app.querySelectorAll(`[data-hover="${s}"]`).forEach((el) => el.classList.add('hover'));
});

// ---------------- interaction (event delegation) ----------------

app.addEventListener('click', (e) => {
  if (suppressClick) return;
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { toggleLang(langBtn.dataset.lang); return; }
  const scriptBtn = e.target.closest('[data-script]');
  if (scriptBtn) { setScript(scriptBtn.dataset.script, scriptBtn.dataset.native === '1'); return; }
  const open = e.target.closest('[data-open]');
  if (open) {
    const p = PUZZLES.find((x) => x.id === open.dataset.open);
    if (p) openPuzzle(p);
    return;
  }
  if (!game || game.solved) return;
  if (e.detail === 3 && e.target.closest('.wordrow')) { placeAllCorrectly(); return; }
  const twistBtn = e.target.closest('[data-twist]');
  if (twistBtn) {
    const slot = Number(twistBtn.dataset.slotTurn);
    rotatePiece(slot, twist(game.placement[slot].orient, slot, Number(twistBtn.dataset.twist)));
    return;
  }
  const hideBtn = e.target.closest('[data-hideword]');
  if (hideBtn) {
    const slot = game.focus;
    if (slot >= 0 && game.placement[slot]) rotatePiece(slot, hideWordOrient(game.placement[slot].orient, slot, Number(hideBtn.dataset.hideword)));
    return;
  }
  const toPool = e.target.closest('[data-topool]');
  if (toPool) {
      move(toPool.dataset.topool, 'pool');
    return;
  }
  const chip = e.target.closest('[data-card]');
  if (chip && locate(chip.dataset.card) < 0 && game.focus >= 0) {
    // Put the pile piece into the selected corner (a piece already there goes back to the pile).
    move(chip.dataset.card, game.focus);
  }
});

app.addEventListener('dragstart', (e) => {
  const chip = e.target.closest('[data-card]');
  if (!chip) return;
  e.dataTransfer.setData('text/plain', chip.dataset.card);
  e.dataTransfer.effectAllowed = 'move';
});
app.addEventListener('dragover', (e) => {
  const t = e.target.closest('[data-slot],[data-pool]');
  if (!t) return;
  e.preventDefault();
  app.querySelectorAll('.dragover').forEach((x) => x !== t && x.classList.remove('dragover'));
  t.classList.add('dragover');
});
app.addEventListener('dragleave', (e) => {
  const t = e.target.closest('[data-slot],[data-pool]');
  if (t && !t.contains(e.relatedTarget)) t.classList.remove('dragover');
});
app.addEventListener('drop', (e) => {
  const t = e.target.closest('[data-slot],[data-pool]');
  if (!t || !game) return;
  e.preventDefault();
  t.classList.remove('dragover');
  const id = e.dataTransfer.getData('text/plain');
  if (!id || !game.cards[id]) return;
  const toPool = t.dataset.slot === undefined;
  move(id, toPool ? 'pool' : Number(t.dataset.slot));
});

// The logo goes back to the puzzle list (without reloading the page).
document.getElementById('home').addEventListener('click', (e) => {
  e.preventDefault();
  if (game) closePuzzle();
  else window.scrollTo(0, 0);
});

// ---------------- boot ----------------

const initial = PUZZLES.find((p) => `#${p.id}` === location.hash);
if (initial) openPuzzle(initial);
else render();
</script>
</body>
</html>
